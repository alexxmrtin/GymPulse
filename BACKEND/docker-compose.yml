services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: gympulse-postgres
    environment:
      POSTGRES_DB: gympulse
      POSTGRES_USER: ${POSTGRES_USUARIO}
      POSTGRES_PASSWORD: ${POSTGRES_CONTRASENA}
    ports:
      - "5432:5432"
    volumes:
      - gympulse-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USUARIO} -d gympulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  gympulse-datos:
