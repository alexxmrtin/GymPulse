# Configuracion solo para los tests. Al llamarse igual que la de src/main/resources, esta la
# sustituye entera cuando se ejecutan con mvn test.

# H2 en memoria imitando a PostgreSQL: los tests no necesitan Docker y cada ejecucion arranca limpia.
spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Secreto ficticio para que el contexto arranque sin depender del .env.
gympulse.jwt.secreto=secreto-de-pruebas-que-no-vale-para-nada-pero-mide-mas-de-32
gympulse.jwt.duracion-minutos=60
gympulse.jwt.refresco-dias=30

gympulse.login.max-fallos-email=5
gympulse.login.max-fallos-ip=20
gympulse.login.ventana-minutos=15
gympulse.login.bloqueo-minutos=15

gympulse.registro.verificar-email=false
gympulse.registro.verificacion-horas=24
gympulse.url-publica=http://localhost:8080
gympulse.google.client-id=cliente-de-pruebas.apps.googleusercontent.com
