spring.application.name=GymPulseBackend

# Carga el archivo .env (ignorado por git) como si fueran propiedades. "optional:" significa
# que si no existe la app arranca igual, para no romper el despliegue: alli las variables
# vienen del entorno del servidor, no de un archivo.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos ---
# PostgreSQL local (docker-compose.yml).
spring.datasource.url=jdbc:postgresql://localhost:5432/gympulse
spring.datasource.username=${POSTGRES_USUARIO}
spring.datasource.password=${POSTGRES_CONTRASENA}
# Hibernate crea y actualiza las tablas segun las entidades, sin borrar los datos.
spring.jpa.hibernate.ddl-auto=update

# --- JWT ---
# Clave con la que se firman y verifican los tokens. NO tiene valor por defecto a proposito:
# si falta, la app no arranca. Sale del .env en local y de la variable de entorno en produccion.
gympulse.jwt.secreto=${JWT_SECRETO}
# Duracion del token de acceso (minutos) y del de refresco (dias).
gympulse.jwt.duracion-minutos=15
gympulse.jwt.refresco-dias=30

# --- Limite de intentos de login ---
gympulse.login.max-fallos-email=5
gympulse.login.max-fallos-ip=20
gympulse.login.ventana-minutos=15
gympulse.login.bloqueo-minutos=15

# --- Login con Google ---
gympulse.google.client-id=20851674149-r2drk3iu81k4va83qviev2483ti66d57.apps.googleusercontent.com

# --- Registro ---
gympulse.registro.verificar-email=true
gympulse.registro.verificacion-horas=24
gympulse.url-publica=http://localhost:8080

# --- Subida de archivos ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Muestra en consola el SQL que genera Hibernate. Util para aprender y depurar.
spring.jpa.show-sql=true

# --- Logging ---
# Escribe los logs en un archivo dentro de /logs
logging.file.name=logs/gympulse.log
# Formato: fecha hora [hilo] nivel clase - mensaje
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Nivel de detalle: DEBUG para nuestro codigo, INFO para el resto de Spring
logging.level.com.gympulse=DEBUG
logging.level.org.springframework=INFO
