spring.application.name=GymPulseBackend

# Carga el archivo .env (ignorado por git) como si fueran propiedades. "optional:" significa
# que si no existe la app arranca igual, para no romper el despliegue: alli las variables
# vienen del entorno del servidor, no de un archivo.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos ---
# H2 en modo archivo: los datos sobreviven a los reinicios (en memoria se borraban).
spring.datasource.url=jdbc:h2:file:./data/gympulse
spring.datasource.username=sa
spring.datasource.password=
# Hibernate crea y actualiza las tablas segun las entidades, sin borrar los datos.
spring.jpa.hibernate.ddl-auto=update
# Consola web para inspeccionar la BD en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- JWT ---
# Clave con la que se firman y verifican los tokens. NO tiene valor por defecto a proposito:
# si falta, la app no arranca. Sale del .env en local y de la variable de entorno en produccion.
gympulse.jwt.secreto=${JWT_SECRETO}
# Cuanto vale el token antes de caducar. 720 minutos = 12 horas.
gympulse.jwt.duracion-minutos=720

# Muestra en consola el SQL que genera Hibernate. Util para aprender y depurar.
spring.jpa.show-sql=true

# --- Logging ---
# Escribe los logs en un archivo dentro de /logs
logging.file.name=logs/gympulse.log
# Formato: fecha hora [hilo] nivel clase - mensaje
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Nivel de detalle: DEBUG para nuestro codigo, INFO para el resto de Spring
logging.level.com.gympulse=DEBUG
logging.level.org.springframework=INFO
