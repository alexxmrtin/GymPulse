# Se activa con SPRING_PROFILES_ACTIVE=prod y se suma a application.properties, sustituyendo lo que repite.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USUARIO}
spring.datasource.password=${DATABASE_CONTRASENA}

spring.jpa.show-sql=false
logging.level.com.gympulse=INFO

gympulse.https-obligatorio=true
server.forward-headers-strategy=framework

gympulse.cors.origenes=${GYMPULSE_CORS_ORIGENES}
gympulse.url-publica=${GYMPULSE_URL_PUBLICA}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO}
spring.mail.password=${MAIL_CONTRASENA}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
gympulse.correo.remitente=${MAIL_REMITENTE}
